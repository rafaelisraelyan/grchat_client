name: Closed beta signaling
on:
  workflow_dispatch:
    inputs:
      server_sha:
        description: Exact GRChat server commit
        type: string
        required: true

permissions:
  contents: read

jobs:
  pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
        env:
          POSTGRES_DB: grchat_test
          POSTGRES_USER: grchat
          POSTGRES_PASSWORD: grchat
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U grchat -d grchat_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      SERVER_SHA: ${{ inputs.server_sha }}
      GRCHAT_TEST_FILE_ROOT: ${{ github.workspace }}/grchat-server-tests
    steps:
      - name: Require a server commit
        run: |
          if [[ ! "$SERVER_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'Supply the full verified SHA of the server commit.'
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          path: client
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: rafaelisraelyan/grchat-server
          ref: ${{ inputs.server_sha }}
          token: ${{ secrets.GRCHAT_SERVER_READ_TOKEN }}
          path: server
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Flutter Linux native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtk-3-dev libx11-dev libxi-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: client
      - name: Require all seven Stage 2B TLS scenarios
        run: bash server/tool/test-stage2b-ci.sh client
        env:
          GRCHAT_TEST_JDBC: jdbc:postgresql://127.0.0.1:${{ job.services.postgres.ports['5432'] }}/grchat_test
