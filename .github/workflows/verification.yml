name: Client verification
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Check formatting of changed Dart files
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          $base = $env:BASE_SHA
          if (!$base -or $base -match '^0+$') { $base = 'HEAD^' }
          $files = @(git diff --name-only --diff-filter=ACMRT $base HEAD -- '*.dart')
          if ($LASTEXITCODE -ne 0) { throw 'Unable to determine changed Dart files' }
          if ($files.Count) {
            dart format --output=none --set-exit-if-changed @files
            if ($LASTEXITCODE -ne 0) { throw 'Dart formatting mismatch' }
          }
      - run: dart analyze lib test integration_test
      - run: flutter test --no-pub --reporter expanded
      - name: Build Windows debug
        run: flutter build windows --debug --no-pub

  dependencies:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.1
    with:
      scan-args: |-
        --lockfile=./pubspec.lock
      upload-sarif: false
