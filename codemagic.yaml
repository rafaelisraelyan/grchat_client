workflows:
  macos-release:
    name: macOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      # Hermetic tests only: goldens are Windows pixel-exact and the
      # connection/signaling tests need a live dev server + Postgres.
      - name: Hermetic tests
        script: flutter test test/reconnect_test.dart test/logo_asset_test.dart
      - name: Build macOS
        script: flutter build macos --release
      - name: Pack .app and DMG
        script: |
          cd build/macos/Build/Products/Release
          APP=$(ls -d *.app | head -1)
          echo "APP=$APP"
          zip -r -y "$CM_BUILD_DIR/grchat_client-macos.zip" "$APP"
          STAGE="$CM_BUILD_DIR/dmg_stage"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname GRChat \
            -srcfolder "$STAGE" -ov -format UDZO \
            "$CM_BUILD_DIR/grchat_client-macos.dmg"
    artifacts:
      - grchat_client-macos.zip
      - grchat_client-macos.dmg
